name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: R ${{ matrix.r }}
    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'oldrel-1']

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install dependencies
        run: install.packages(c("data.table", "ggplot2"))
        shell: Rscript {0}

      - name: Run test suite
        run: Rscript tests/test_smr.R

      - name: Run example (smoke test)
        run: Rscript run_example.R
